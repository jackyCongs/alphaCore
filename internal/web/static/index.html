<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaCore | Real-Time ETF Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --up-color: #ef4444; /* Up (Red) */
            --up-bg: rgba(239, 68, 68, 0.15);
            --down-color: #10b981; /* Down (Green) */
            --down-bg: rgba(16, 185, 129, 0.15);
            --live-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 17, 26, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            font-weight: 800;
            font-size: 1.8rem;
            color: #60a5fa;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .container {
            max-width: 1400px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        /* ==================== TABLE LAYOUT ==================== */
        .table-wrapper {
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        tbody td {
            padding: 0.6rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
        }

        .col-code { width: 20%; font-weight: 700; color: var(--text-primary); }
        .col-iopv { width: 30%; font-size: 1.05rem; font-weight: 700; }
        .col-rate { width: 25%; font-weight: 700; }
        .col-time { width: 25%; color: var(--text-secondary); font-size: 0.8rem; }

        .up { color: var(--up-color); }
        .down { color: var(--down-color); }
        .flat { color: var(--text-secondary); }

        /* Status Indicator */
        .status {
            position: absolute;
            top: 1.8rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--live-color);
            border-radius: 50%;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            padding: 1.2rem;
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .stat-item { text-align: center; }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .stat-value.up { color: var(--up-color); }
        .stat-value.down { color: var(--down-color); }
        .stat-value.flat { color: var(--text-secondary); }

    </style>
</head>
<body>

    <header>
        <h1>AlphaCore</h1>
        <div class="subtitle">Real-Time Analysis Engine</div>
        <div class="status">
            <span class="dot"></span> Live
        </div>
    </header>

    <div class="container">
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-label">Total ETFs</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Up 📈</div>
                <div class="stat-value up" id="statUp">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Flat ➖</div>
                <div class="stat-value flat" id="statFlat">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Down 📉</div>
                <div class="stat-value down" id="statDown">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Avg Return</div>
                <div class="stat-value" id="statAvg">0.00%</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-code">ETF Code</th>
                        <th class="col-iopv">Real-Time IOPV</th>
                        <th class="col-rate">Change</th>
                        <th class="col-time">Last Update</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('tableBody');

        // Stores: code -> { data, row, iopvCell, rateCell, timeCell, lastIopvStr }
        const etfMap = {};
        let sortedCodes = [];
        let needsSort = false;

        // Pre-cache stat elements
        const statTotal = document.getElementById('statTotal');
        const statUp = document.getElementById('statUp');
        const statFlat = document.getElementById('statFlat');
        const statDown = document.getElementById('statDown');
        const statAvg = document.getElementById('statAvg');

        const formatPrice = (val) => val.toFixed(4);
        const formatRate = (val) => (val * 100).toFixed(2) + '%';
        const formatTime = (ts) => {
            if (!ts) return '--:--:--';
            const d = new Date(ts);
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            const ms = String(d.getMilliseconds()).padStart(3, '0');
            return h + ':' + m + ':' + s + '.' + ms;
        };

        const createRow = (code) => {
            const row = document.createElement('tr');
            row.id = 'row-' + code;

            const tdCode = document.createElement('td');
            tdCode.className = 'col-code';
            tdCode.textContent = code;

            const tdIopv = document.createElement('td');
            tdIopv.className = 'col-iopv';
            tdIopv.textContent = '--';

            const tdRate = document.createElement('td');
            tdRate.className = 'col-rate';
            tdRate.textContent = '--';

            const tdTime = document.createElement('td');
            tdTime.className = 'col-time';
            tdTime.textContent = '--';

            row.appendChild(tdCode);
            row.appendChild(tdIopv);
            row.appendChild(tdRate);
            row.appendChild(tdTime);

            etfMap[code] = {
                data: null,
                row: row,
                iopvCell: tdIopv,
                rateCell: tdRate,
                timeCell: tdTime,
                lastIopvStr: '--'
            };
            needsSort = true;
            return row;
        };

        const applySnapshot = (snapshot) => {
            if (!snapshot || !snapshot.length) return;

            // 1. Ingest data and ensure rows exist
            for (let i = 0; i < snapshot.length; i++) {
                const item = snapshot[i];
                const code = item.i;
                if (!etfMap[code]) {
                    createRow(code);
                }
                etfMap[code].data = item;
            }

            // 2. Sort and rebuild table body only if new rows were added
            if (needsSort) {
                sortedCodes = Object.keys(etfMap).sort();
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < sortedCodes.length; i++) {
                    fragment.appendChild(etfMap[sortedCodes[i]].row);
                }
                tableBody.appendChild(fragment);
                needsSort = false;
            }

            // 3. Update only the cells that changed
            for (let i = 0; i < snapshot.length; i++) {
                const item = snapshot[i];
                const entry = etfMap[item.i];
                const isUp = item.r >= 0;
                const sign = isUp ? '+' : '';
                const newIopvStr = formatPrice(item.iopv);

                entry.iopvCell.textContent = newIopvStr;
                entry.rateCell.textContent = sign + formatRate(item.r);
                entry.rateCell.className = 'col-rate ' + (isUp ? 'up' : 'down');
                entry.timeCell.textContent = formatTime(item.t);
                entry.lastIopvStr = newIopvStr;
            }

            // 4. Update stats
            updateStats();
        };

        const updateStats = () => {
            const total = sortedCodes.length;
            if (total === 0) return;

            let up = 0, down = 0, flat = 0, sum = 0;
            for (let i = 0; i < sortedCodes.length; i++) {
                const entry = etfMap[sortedCodes[i]];
                if (!entry.data) continue;
                const r = entry.data.r;
                if (r > 0) up++;
                else if (r < 0) down++;
                else flat++;
                sum += r;
            }

            const avg = sum / total;
            statTotal.textContent = total;
            statUp.textContent = up;
            statFlat.textContent = flat;
            statDown.textContent = down;
            statAvg.textContent = (avg > 0 ? '+' : '') + (avg * 100).toFixed(4) + '%';
            statAvg.className = 'stat-value ' + (avg > 0 ? 'up' : (avg < 0 ? 'down' : 'flat'));
        };

        // 1. Fetch initial snapshot
        fetch('/api/snapshot')
            .then(res => res.json())
            .then(data => applySnapshot(data))
            .catch(err => console.error("Snapshot error:", err));

        // 2. Connect to SSE — server already throttles to 500ms intervals
        const eventSource = new EventSource('/stream');
        eventSource.onmessage = (e) => {
            try {
                const snapshot = JSON.parse(e.data);
                requestAnimationFrame(() => applySnapshot(snapshot));
            } catch (err) {
                console.error("Parse error:", err);
            }
        };

        eventSource.onerror = (err) => {
            console.error("SSE Connection error", err);
        };
    </script>
</body>
</html>
